services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_automl
    restart: always
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: atul1306
      MONGO_INITDB_ROOT_PASSWORD: 12345
    volumes:
      - mongodb_data:/data/automl_db
    

  
  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081" # Exposes Mongo Express on localhost:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: atul1306
      ME_CONFIG_MONGODB_ADMINPASSWORD: 12345
      ME_CONFIG_MONGODB_SERVER: mongodb

volumes:
  mongodb_data: